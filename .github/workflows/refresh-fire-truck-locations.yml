name: Update Fire Truck Data

on:
  workflow_dispatch:     # Allow manual trigger
  repository_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Need write permission to update the cached file

    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: code
          sparse-checkout: |
            package.json
            package-lock.json
            index.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch today's data files
        run: |
          TODAY=$(TZ=Asia/Kolkata date '+%Y%m%d')
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          mkdir -p data/csv

          # Blobless fetch: downloads commit + tree objects only (~few KB), no blob content
          git fetch --filter=blob:none --depth=1 origin data

          # Lazily fetch only the 3 blobs we need for today's run
          git checkout origin/data -- data/coverage.csv                               2>/dev/null || true
          git checkout origin/data -- "data/csv/goa-fire-trucks-${TODAY}.csv"         2>/dev/null || true
          git checkout origin/data -- "data/goa-fire-trucks-gpx-${TODAY}.geojson"     2>/dev/null || true

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Fetch and process API data
        run: npm start
        env:
          TEST_STATUS: OK

      - name: Commit and push to data branch
        id: commit-data
        run: |
          GPX_FILE="data/goa-fire-trucks-gpx-${TODAY}.geojson"
          CSV_FILE="data/csv/goa-fire-trucks-${TODAY}.csv"

          # Write output files as loose blob objects (no branch switch needed)
          BLOB_JSON=$(git hash-object -w data/goa-fire-trucks.geojson)
          BLOB_GPX=$(git hash-object  -w "$GPX_FILE")
          BLOB_CSV=$(git hash-object  -w "$CSV_FILE")
          BLOB_COV=$(git hash-object  -w data/coverage.csv)

          # Read the data branch's full tree into a separate index (reads tree objects only, no blobs)
          GIT_INDEX_FILE=/tmp/data-index git read-tree origin/data

          # Override only our 4 changed paths in that index
          GIT_INDEX_FILE=/tmp/data-index git update-index --add --cacheinfo 100644,"$BLOB_JSON",data/goa-fire-trucks.geojson
          GIT_INDEX_FILE=/tmp/data-index git update-index --add --cacheinfo 100644,"$BLOB_GPX","$GPX_FILE"
          GIT_INDEX_FILE=/tmp/data-index git update-index --add --cacheinfo 100644,"$BLOB_CSV","$CSV_FILE"
          GIT_INDEX_FILE=/tmp/data-index git update-index --add --cacheinfo 100644,"$BLOB_COV",data/coverage.csv

          # Create tree → commit → push (sends only 4 new blobs + tree + commit)
          NEW_TREE=$(GIT_INDEX_FILE=/tmp/data-index git write-tree)
          NEW_COMMIT=$(echo "Refresh fire truck data [skip ci]" | git commit-tree "$NEW_TREE" -p origin/data)
          git push origin "$NEW_COMMIT:refs/heads/data"

          echo "data_commit_sha=$NEW_COMMIT" >> $GITHUB_OUTPUT

      - name: Report success status to data branch
        if: success()
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.commit-data.outputs.data_commit_sha }} \
            -d '{
              "state": "success",
              "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "API data updated successfully",
              "context": "ci/data-update"
            }'

      - name: Report failure status to data branch
        if: failure()
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.commit-data.outputs.data_commit_sha }} \
            -d '{
              "state": "failure",
              "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "API data update failed",
              "context": "ci/data-update"
            }'

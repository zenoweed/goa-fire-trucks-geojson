name: Update Fire Truck Data

on:
  workflow_dispatch:     # Allow manual trigger
  repository_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: code
          sparse-checkout: |
            package.json
            package-lock.json
            index.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch today's data files
        run: |
          TODAY=$(TZ=Asia/Kolkata date '+%Y%m%d')
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          mkdir -p data/csv

          # Download only the 3 files we need — no git fetch of the data branch at all
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/data"
          H="Authorization: Bearer ${{ github.token }}"
          curl -sfL -H "$H" -o data/coverage.csv                              "$RAW/data/coverage.csv"                               || true
          curl -sfL -H "$H" -o "data/csv/goa-fire-trucks-${TODAY}.csv"        "$RAW/data/csv/goa-fire-trucks-${TODAY}.csv"            || true
          curl -sfL -H "$H" -o "data/goa-fire-trucks-gpx-${TODAY}.geojson"    "$RAW/data/goa-fire-trucks-gpx-${TODAY}.geojson"        || true

      - name: Fetch and process API data
        run: npm start
        env:
          TEST_STATUS: OK

      - name: Commit and push to data branch
        id: commit-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 << 'EOF'
          import base64, json, os
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError

          TOKEN = os.environ['GH_TOKEN']
          REPO  = os.environ['GITHUB_REPOSITORY']
          TODAY = os.environ['TODAY']

          def api(method, path, body=None):
              req = Request(
                  f'https://api.github.com/repos/{REPO}/{path}',
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={
                      'Authorization': f'Bearer {TOKEN}',
                      'Content-Type': 'application/json',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
                  method=method,
              )
              with urlopen(req) as r:
                  return json.loads(r.read())

          def upload_blob(path):
              with open(path, 'rb') as f:
                  content = base64.b64encode(f.read()).decode()
              return api('POST', 'git/blobs', {'content': content, 'encoding': 'base64'})['sha']

          gpx_file = f'data/goa-fire-trucks-gpx-{TODAY}.geojson'
          csv_file = f'data/csv/goa-fire-trucks-{TODAY}.csv'

          # Anchor point: current data branch tip
          head_sha  = api('GET', 'git/refs/heads/data')['object']['sha']
          base_tree = api('GET', f'git/commits/{head_sha}')['tree']['sha']

          # Upload our 4 output files as blobs (parallel would be nice but serial is fine)
          blobs = {
              'data/goa-fire-trucks.geojson': upload_blob('data/goa-fire-trucks.geojson'),
              gpx_file:                       upload_blob(gpx_file),
              csv_file:                       upload_blob(csv_file),
              'data/coverage.csv':            upload_blob('data/coverage.csv'),
          }

          # Create a new tree on top of the existing one (only our 4 paths change)
          new_tree = api('POST', 'git/trees', {
              'base_tree': base_tree,
              'tree': [
                  {'path': p, 'mode': '100644', 'type': 'blob', 'sha': s}
                  for p, s in blobs.items()
              ],
          })['sha']

          # Create commit
          new_commit = api('POST', 'git/commits', {
              'message': 'Refresh fire truck data [skip ci]',
              'tree':    new_tree,
              'parents': [head_sha],
          })['sha']

          # Advance the data branch ref
          api('PATCH', 'git/refs/heads/data', {'sha': new_commit})

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'data_commit_sha={new_commit}\n')

          print(f'Committed {new_commit[:8]} to data branch')
          EOF

      - name: Report success status to data branch
        if: success()
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.commit-data.outputs.data_commit_sha }} \
            -d '{
              "state": "success",
              "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "API data updated successfully",
              "context": "ci/data-update"
            }'

      - name: Report failure status to data branch
        if: failure()
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.commit-data.outputs.data_commit_sha }} \
            -d '{
              "state": "failure",
              "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "API data update failed",
              "context": "ci/data-update"
            }'
